<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>

    <!-- Cyan to Purple Accent Gradient -->
    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Text Fill Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="glowCyan" cx="15%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="85%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#00D2FF" fill-opacity="0.3"/>
    </pattern>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Base Layer -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="16"/>

  <!-- Ambient Glows -->
  <rect width="1200" height="350" fill="url(#glowCyan)" rx="16"/>
  <rect width="1200" height="350" fill="url(#glowPurple)" rx="16"/>

  <!-- Tech Grid Overlay -->
  <rect width="1200" height="350" fill="url(#grid)" rx="16" opacity="0.85"/>

  <!-- Top Accent Border Line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#primaryAccent)" rx="2"/>

  <!-- Neural Network / Circuit Graph Vector Graphics -->
  <g opacity="0.35">
    <!-- Connecting Nodes & Lines (Left Side) -->
    <line x1="100" y1="80" x2="180" y2="140" stroke="#00D2FF" stroke-width="1.5" stroke-dasharray="4 2"/>
    <line x1="180" y1="140" x2="140" y2="230" stroke="#8B5CF6" stroke-width="1.5"/>
    <line x1="180" y1="140" x2="260" y2="180" stroke="#00D2FF" stroke-width="1.5"/>
    <line x1="260" y1="180" x2="220" y2="270" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3 3"/>

    <circle cx="100" cy="80" r="4" fill="#00D2FF"/>
    <circle cx="180" cy="140" r="6" fill="#7C3AED"/>
    <circle cx="140" cy="230" r="4" fill="#00D2FF"/>
    <circle cx="260" cy="180" r="5" fill="#38BDF8"/>
    <circle cx="220" cy="270" r="4" fill="#A78BFA"/>

    <!-- Connecting Nodes & Lines (Right Side) -->
    <line x1="1100" y1="100" x2="1010" y2="160" stroke="#8B5CF6" stroke-width="1.5"/>
    <line x1="1010" y1="160" x2="1060" y2="250" stroke="#00D2FF" stroke-width="1.5" stroke-dasharray="4 2"/>
    <line x1="1010" y1="160" x2="930" y2="200" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="930" y1="200" x2="980" y2="280" stroke="#8B5CF6" stroke-width="1.5"/>

    <circle cx="1100" cy="100" r="5" fill="#A78BFA"/>
    <circle cx="1010" cy="160" r="6" fill="#00D2FF"/>
    <circle cx="1060" cy="250" r="4" fill="#8B5CF6"/>
    <circle cx="930" cy="200" r="5" fill="#38BDF8"/>
    <circle cx="980" cy="280" r="4" fill="#00D2FF"/>
  </g>

  <!-- Futuristic Corner Framing Brackets -->
  <g stroke="#00D2FF" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 30 50 L 30 30 L 50 30"/>
    <path d="M 1170 50 L 1170 30 L 1150 30"/>
    <path d="M 30 300 L 30 320 L 50 320"/>
    <path d="M 1170 300 L 1170 320 L 1150 320"/>
  </g>

  <!-- Center Content Block -->
  <!-- Status Badge -->
  <g transform="translate(600, 65)">
    <rect x="-200" y="-16" width="400" height="32" rx="16" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.2"/>
    <circle cx="-175" cy="0" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-160" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="600" fill="#A5B4FC" letter-spacing="1.5">AI BUILDER • PRODUCT EXPERIMENTER</text>
  </g>

  <!-- Main Title Name -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="52" font-weight="800" fill="url(#textGrad)" letter-spacing="4">AMOGH REDDY</text>

  <!-- Subtitle Line -->
  <text x="600" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="18" font-weight="500" fill="#38BDF8" letter-spacing="2">TURNING IDEAS INTO WORKING PRODUCTS THROUGH AI-ASSISTED DEVELOPMENT</text>

  <!-- Horizontal Divider Line -->
  <line x1="450" y1="215" x2="750" y2="215" stroke="url(#primaryAccent)" stroke-width="2" stroke-linecap="round"/>

  <!-- Key Pillars / Focus Tags -->
  <g transform="translate(600, 260)">
    <!-- Tag 1: GenAI & LLMs -->
    <g transform="translate(-230, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#1E293B" stroke="#00D2FF" stroke-width="1" stroke-opacity="0.6"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">🤖 GenAI &amp; LLMs</text>
    </g>

    <!-- Tag 2: AI Agents -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.6"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">🧠 AI Agents</text>
    </g>

    <!-- Tag 3: Applied ML -->
    <g transform="translate(230, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">📊 Applied ML</text>
    </g>
  </g>

  <!-- Footer Tagline / Subtitle -->
  <text x="600" y="315" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#64748B" letter-spacing="1">Malla Reddy Engineering College • B.Tech CSE (AI &amp; ML) 2028</text>
</svg>
